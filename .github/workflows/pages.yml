name: Deploy Haven to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify account access rules
        run: |
          if npm run test:rules > /tmp/haven-rules.log 2>&1; then
            cat /tmp/haven-rules.log
          else
            status=$?
            cat /tmp/haven-rules.log
            python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path('/tmp/haven-rules.log').read_text()
          diagnostic = log[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Account rule diagnostics::' + diagnostic)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Account access-rule test failure\n\n```text\n' + log[-16000:] + '\n```\n')
          PYTHON
            exit "$status"
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build -- --base=/Item-finder/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
